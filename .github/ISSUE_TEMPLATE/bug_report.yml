name: Bug report
description: Report a reproducible problem in Vitrum
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include server credentials, subscription URLs, private IPs, tokens or personal data.
        For security vulnerabilities, follow SECURITY.md instead of opening a public issue.
  - type: input
    id: version
    attributes:
      label: Vitrum version
      description: For example, 2.0.0
      placeholder: 2.0.0
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and device
      placeholder: Android version / device model
    validations:
      required: true
  - type: dropdown
    id: build
    attributes:
      label: Build
      options:
        - Main ARM64
        - Lite ARMv7
        - Debug / locally built
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Tap...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, server addresses, subscription links and personal data before attaching anything.
    validations:
      required: false
