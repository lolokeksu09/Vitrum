name: Feature request
description: Suggest a focused improvement to Vitrum
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What limitation or user problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and security impact
      description: Mention Android versions, permissions, VPN/TUN, DNS, routing or privacy implications if known.
    validations:
      required: false
