version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - android
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
