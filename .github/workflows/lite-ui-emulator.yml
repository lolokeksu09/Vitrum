name: Lite Android 6 UI emulator smoke

on:
  pull_request:
    paths:
      - 'lite/**'
      - 'tools/lite-emulator-smoke.sh'
      - '.github/workflows/lite-ui-emulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM on runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 6 UI-only emulator (not an ARM32 Xray device test)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 23
          arch: x86
          target: default
          profile: Nexus 10
          ram-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            # UI-only x86 build. Never distribute this APK; ARM32 production build runs in lite.yml.
            sed -i 's/abiFilters += listOf("armeabi-v7a")/abiFilters += listOf("x86")/' lite/build.gradle.kts
            ./gradlew :lite:assembleDebug --no-daemon --console=plain
            bash tools/lite-emulator-smoke.sh
      - name: Upload emulator screenshots and UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite-api23-emulator-ui
          path: emulator-report/
          if-no-files-found: warn
