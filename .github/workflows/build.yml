name: build
run-name: Vitrum ${{ inputs.tag || github.ref_name }} · ${{ inputs.source_ref || github.sha }} · ${{ inputs.request_id || github.run_id }}

# Historical tags v2.0.0 and v2.8.3 are excluded from automatic tag-triggered builds.
# Manual dispatch remains explicit and is subject to the release checks below.
on:
  push:
    tags: ['v*', '!v2.8.3', '!v2.0.0']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example, v1.0.0). The APK is uploaded to GitHub Releases as a pre-release.'
        required: true
      source_ref:
        description: 'Commit SHA or branch to build before creating the release tag (optional)'
        required: false
      request_id:
        description: 'Caller workflow run ID used to correlate this build (optional)'
        required: false
      stable:
        description: 'Publish as a stable release (not a pre-release); use only after device verification.'
        type: boolean
        default: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  RELEASE_SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && (inputs.source_ref != '' && inputs.source_ref || inputs.tag) || github.ref_name }}

jobs:
  tests-and-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}
      - name: Validate release candidate version before creating the tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid release tag'; exit 1; }
          ACTUAL="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*\"([^\"]+)\".*$/\1/p' app/build.gradle.kts)"
          test "$ACTUAL" = "${RELEASE_TAG#v}" || { echo "::error::versionName does not match $RELEASE_TAG"; exit 1; }
          SOURCE_SHA="$(git rev-parse HEAD)"
          if git ls-remote --exit-code origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_SHA="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
            test "$TAG_SHA" = "$SOURCE_SHA" || { echo '::error::Existing release tag points to another commit'; exit 1; }
          fi
          echo "Candidate $SOURCE_SHA matches $RELEASE_TAG"
      - name: Validate existing tag and version
        if: ${{ github.event_name == 'push' || inputs.source_ref == '' }}
        run: bash tools/verify-release.sh "$RELEASE_TAG"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Android API 37.0 and Build Tools
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$MANAGER" || { echo "::error::Android sdkmanager unavailable"; exit 1; }
          "$MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$SDK/platforms/android-37.0/android.jar" || { echo "::error::Android SDK 37.0 platform missing"; exit 1; }
      - name: Fetch Xray and databases (verify SHA-256); provide Linux Xray for tests
        run: tools/FETCH_BINARIES.sh --linux
      - name: Unit tests and Debug + Clone builds
        run: ./gradlew :app:testCloneUnitTest assembleDebug assembleClone assembleCloneAndroidTest --no-daemon --console=plain
      - name: Release APK (R8) — only the existing author key
        env:
          KS_B64: ${{ secrets.VITRUM_KS_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.VITRUM_KS_PASS }}
          EXPECTED_CERT: 8cb8b675f97239948f0b93ac4208464e856397d6141268798129c00337205c61
        run: |
          set -euo pipefail
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS_SECRET" ]; then
            echo "::error::Official release requires VITRUM_KS_BASE64 and VITRUM_KS_PASS. No ephemeral-key fallback is permitted."
            exit 1
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p release-apk keystore
          umask 077
          trap 'rm -f keystore/vitrum-release.jks' EXIT
          printf '%s' "$KS_B64" | base64 -d > keystore/vitrum-release.jks
          VITRUM_KS_PASS="$KS_PASS_SECRET" ./gradlew :app:assembleRelease --no-daemon --console=plain
          OUT="release-apk/Vitrum-release-author.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          CERTS="$("$BT/apksigner" verify --print-certs "$OUT")"
          GOT="$(printf '%s\n' "$CERTS" | grep -m1 'certificate SHA-256 digest' | sed 's/.*digest: //' | tr -d ' :' | tr 'A-F' 'a-f')"
          echo "Signing certificate SHA-256: ${GOT:-missing}"
          [ "$GOT" = "$EXPECTED_CERT" ] || {
            echo "::error::Official signing certificate differs from the installed VITRUM release"
            rm -f "$OUT"; exit 1
          }
          echo "Release APK verified against the original author certificate"
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/test-results/testCloneUnitTest/*.xml
          if-no-files-found: warn
      - name: Debug APK (debug-signed; not for release)
        uses: actions/upload-artifact@v7
        with:
          name: Vitrum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Release-APK (R8)
        uses: actions/upload-artifact@v7
        with:
          name: Vitrum-release-apk
          path: release-apk/*.apk
          if-no-files-found: error

  release:
    # Upload the APK to GitHub Releases for v* tags or a manual run with an explicit tag.
    # Releases are pre-releases by default; a manual run with stable=true marks the release as stable after device verification.
    needs: tests-and-debug-apk
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SOURCE_REF }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: Vitrum-debug-apk
          path: apk-debug
      - uses: actions/download-artifact@v8
        with:
          name: Vitrum-release-apk
          path: apk-release
      - name: Create pre-release with APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ env.RELEASE_TAG }}
          STABLE: ${{ github.event_name == 'workflow_dispatch' && inputs.stable && 'true' || 'false' }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          DBG="Vitrum-$V-debug-fallback.apk"
          test -s apk-release/Vitrum-release-author.apk || {
            echo "::error::Author-signed release APK is missing; do not publish"
            exit 1
          }
          REL="Vitrum-$V.apk"
          cp apk-release/Vitrum-release-author.apk "$REL"
          SIGN='**Signature:** current maintainer key, certificate SHA-256 `8cb8b675f97239948f0b93ac4208464e856397d6141268798129c00337205c61` (verified after build). The official APK updates the previous version with the same certificate. The debug fallback is signed separately and is not an update package.'
          cp "$(ls apk-debug/*.apk | head -n 1)" "$DBG"
          {
            if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; else
              echo "APKs were built by GitHub Actions. They have not been verified on a physical device."; fi
            echo; echo "$SIGN"
            echo; echo '**Files:** `'"$REL"'` — release configuration (R8); `'"$DBG"'` — debug build (fallback only).'
            echo; echo '**SHA-256 checksums for this release:**'; echo '```'; sha256sum "$REL" "$DBG"; echo '```'
          } > release-notes.md
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$TAG" = "v2.8.3" ]; then
            # Persist the actual APK hashes in the checked-in release notes before publishing.
            git fetch origin main
            MAIN_SHA="$(git rev-parse origin/main)"
            git merge-base --is-ancestor "$SOURCE_SHA" "$MAIN_SHA" || {
              echo '::error::Release source is not an ancestor of main; refusing to update release notes'
              exit 1
            }
            git checkout -B release-notes origin/main
            cp release-notes.md "docs/releases/$TAG.md"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "docs/releases/$TAG.md"
            if ! git diff --cached --quiet; then
              git commit -m "docs: record Vitrum 2.8.3 APK checksums"
              git push origin HEAD:main
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            CURRENT_PRERELEASE="$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)"
            if [ "$CURRENT_PRERELEASE" = "false" ] && [ "$STABLE" != "true" ]; then
              echo "Release $TAG is already stable; refusing to modify it without stable=true"
              exit 1
            fi
            gh release edit "$TAG" --notes-file release-notes.md
            if [ "$STABLE" = "true" ]; then
              gh release edit "$TAG" --prerelease=false --latest
            fi
          else
            if [ "$STABLE" = "true" ]; then KIND=--latest; else KIND=--prerelease; fi
            gh release create "$TAG" $KIND --target "$SOURCE_SHA" --title "Vitrum $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "$REL" "$DBG" --clobber
          sha256sum "$REL" "$DBG"
