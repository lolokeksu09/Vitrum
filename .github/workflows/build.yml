name: build

# Запуск только по тегу v* или вручную (Actions → build → Run workflow, указать тег). На каждый push и pull request сборка не идёт:
# перед тегом прогоните тесты локально (tools/build.sh tests).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег выпуска (например v1.0.0): APK сразу уйдёт в GitHub Release (pre-release)'
        required: true

permissions:
  contents: read

jobs:
  tests-and-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Xray и базы (с проверкой SHA-256), Linux-xray для тестов
        run: tools/FETCH_BINARIES.sh --linux
      - name: Модульные тесты и отладочный APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --console=plain
      - name: Release-сборка (R8), подпись одноразовым ключом сборки
        # Ключ выпуска в Actions не передаётся: файл получается той же конфигурации, что и релизный, но подписан ключом, созданным в этом запуске.
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon --console=plain
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p release-apk
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Vitrum CI debug"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ci.jks" --ks-pass pass:android --ks-key-alias ci --key-pass pass:android \
            --out release-apk/Vitrum-release-debugsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs release-apk/Vitrum-release-debugsigned.apk | grep 'SHA-256'
      - name: Отчёты тестов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Отладочный APK (подписан отладочным ключом, не для выпуска)
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Release-APK (R8, отладочная подпись)
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-release-apk
          path: release-apk/*.apk
          if-no-files-found: error

  release:
    # Сразу выкладываем APK в GitHub Release: по тегу v* или по ручному запуску с указанием тега.
    # Ключ выпуска в Actions не передаётся, поэтому релиз всегда pre-release.
    needs: tests-and-debug-apk
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Vitrum-debug-apk
          path: apk-debug
      - uses: actions/download-artifact@v4
        with:
          name: Vitrum-release-apk
          path: apk-release
      - name: Pre-release с APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          REL="Vitrum-${TAG#v}-release-debugsigned.apk"
          DBG="Vitrum-${TAG#v}-debug-fallback.apk"
          cp "$(ls apk-release/*.apk | head -n 1)" "$REL"
          cp "$(ls apk-debug/*.apk | head -n 1)" "$DBG"
          {
            if [ -f "docs/releases/$TAG.md" ]; then cat "docs/releases/$TAG.md"; else
              echo "APK собраны на GitHub Actions и подписаны одноразовым отладочным ключом. Не проверены на устройстве. Поверх выпуска с ключом автора не встанут."; fi
            echo; echo '**Файлы:** `'"$REL"'` — конфигурация release (R8); `'"$DBG"'` — отладочная сборка (запасной вариант).'
            echo; echo '**Контрольные суммы SHA-256 файлов этого релиза:**'; echo '```'; sha256sum "$REL" "$DBG"; echo '```'
          } > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = "true" ] || { echo "Релиз $TAG не pre-release: не трогаю"; exit 1; }
          else
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" --title "Vitrum $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" "$REL" "$DBG" --clobber
          sha256sum "$REL" "$DBG"
