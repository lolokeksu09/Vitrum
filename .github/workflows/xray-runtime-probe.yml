name: xray-runtime-probe

# Non-release validation for both the official Debug target and the isolated Clone build type.
on:
  push:
    branches: [feat/xray-runtime-probe]
    paths:
      - '.github/workflows/xray-runtime-probe.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/pr-check.yml'
      - '.github/workflows/clone-release.yml'
      - 'docs/HANDOFF.md'
      - 'docs/VITRUM_DUORAY_TECHNICAL_ROADMAP.md'
      - 'tools/build.sh'
      - 'app/**'
      - 'gradle/**'
      - 'tools/FETCH_BINARIES.sh'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: true
        default: feat/xray-runtime-probe
        type: string

permissions:
  contents: read

jobs:
  instrumentation-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Download pinned Xray and assets
        run: tools/FETCH_BINARIES.sh --linux
      - name: Unit tests and Debug + Clone APK compilation
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest assembleCloneAndroidTest assembleClone --no-daemon --console=plain
      - name: Verify Clone identity and instrumentation build outputs
        run: |
          set -euo pipefail
          bash tools/verify-clone-apk.sh app/build/outputs/apk/clone/app-clone.apk
          test -n "$(find app/build/outputs/apk/androidTest/clone -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/apk/androidTest/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - name: Upload Clone APK, instrumentation APKs and unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-Clone-Xray-runtime-probe
          path: |
            app/build/outputs/apk/clone/*.apk
            app/build/outputs/apk/androidTest/clone/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 7
