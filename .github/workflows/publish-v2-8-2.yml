name: Publish Vitrum v2.8.2 pre-release candidate

# Run only after the release commit lands on main. build.yml re-tests the immutable tag.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v2-8-2.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: v2.8.2

concurrency:
  group: publish-vitrum-v2-8-2
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/pr-check.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate version and original author certificate
        env:
          KS_B64: ${{ secrets.VITRUM_KS_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.VITRUM_KS_PASS }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8af860a42b8558d00442312c5ab3a339abc41149 HEAD || { echo '::error::Clone integration commits missing from release source'; exit 1; }
          test "$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)" = "${RELEASE_TAG#v}" || { echo "::error::versionName must match $RELEASE_TAG"; exit 1; }
          test "$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)" = '282'
          test -s docs/releases/v2.8.2.md
          test -n "$KS_B64" && test -n "$KS_PASS_SECRET" || { echo '::error::Author signing secrets absent'; exit 1; }
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$KEY_FILE"
          CERT="$(keytool -exportcert -keystore "$KEY_FILE" -alias vitrum -storepass:env KS_PASS_SECRET |
            openssl x509 -inform DER -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr 'A-F' 'a-f')"
          test "$CERT" = '8cb8b675f97239948f0b93ac4208464e856397d6141268798129c00337205c61' || {
            echo '::error::Unexpected author certificate'; exit 1;
          }
      - name: Tag tested candidate and dispatch official signed build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          SHA="$(git rev-parse HEAD)"
          if CURRENT="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$CURRENT" = "$SHA" || { echo '::error::Tag belongs to a different source; refusing replacement'; exit 1; }
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing replacement'
            exit 0
          fi
          gh workflow run build.yml --ref main -f tag="$TAG" -f stable=false
