name: Request Vitrum 2.1.2 signed pre-release

# One-time dispatch for a reviewed Vitrum 2.1.2 main commit.
# Main signing and publishing protections stay in the existing build.yml.
# Remove this request workflow after the release has been verified.
on:
  push:
    branches: [main]
    paths:
      - 'docs/releases/v2.1.2.md'

permissions:
  contents: read
  actions: write

concurrency:
  group: vitrum-v2.1.2-publish-request
  cancel-in-progress: false

jobs:
  dispatch-signed-candidate:
    if: github.repository == 'lolokeksu09/Vitrum'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate exact Vitrum 2.1.2 source version
        run: |
          set -euo pipefail
          CODE="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*$/\1/p' app/build.gradle.kts)"
          NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*$/\1/p' app/build.gradle.kts)"
          test "$CODE" = "287" && test "$NAME" = "2.1.2" || {
            echo "::error::Vitrum 2.1.2 versionCode/versionName mismatch"
            exit 1
          }
          test -s docs/releases/v2.1.2.md
      - name: Dispatch author-signed pre-release; never promote automatically
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v2.1.2 >/dev/null 2>&1; then
            echo "Vitrum 2.1.2 release already exists; refusing to overwrite or re-sign."
            exit 0
          fi
          if git ls-remote --exit-code origin refs/tags/v2.1.2 >/dev/null 2>&1; then
            echo "::error::Tag v2.1.2 already exists without a verified release; manual inspection required."
            exit 1
          fi
          gh workflow run build.yml --ref main \
            -f tag=v2.1.2 \
            -f source_ref="$GITHUB_SHA" \
            -f request_id="v2.1.2-${GITHUB_RUN_ID}"
          echo "Requested existing signed build.yml for exact commit $GITHUB_SHA (pre-release)."
