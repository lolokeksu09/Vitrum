name: Android 13 main app startup smoke

on:
  pull_request:
    paths:
      - 'app/**'
      - 'tools/main-app-startup-smoke.sh'
      - '.github/workflows/main-app-startup-emulator.yml'
      - 'build.gradle.kts'
      - 'gradle/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM on runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch debug and R8-release app on Android 13 emulator (x86_64 UI only)
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            set -euo pipefail
            # The runtime Xray/NI binary is ARM64; this emulates Android UI startup only.
            # Do not distribute these x86_64 packages or assume this validates VPN/TUN.
            sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("x86_64")/' app/build.gradle.kts
            SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            MANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
            test -n "$MANAGER"
            "$MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
            ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --console=plain
            bash tools/main-app-startup-smoke.sh
      - name: Upload sanitized emulator crash reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrum-main-android13-startup-report
          path: |
            emulator-report/*-crash.txt
            emulator-report/*-launch.txt
            emulator-report/*-relaunch.txt
            emulator-report/*-result.txt
            emulator-report/*-logcat.txt
            emulator-report/*-screen.png
            emulator-report/limitations.txt
          if-no-files-found: warn
