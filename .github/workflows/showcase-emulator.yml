name: Vitrum UI screenshot capture (Android 13 emulator)

# Explicit/manual only. Saves real emulator UI pixels as an artifact for review.
# No write access and no automatic screenshot publication.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.repository == 'lolokeksu09/Vitrum'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Vitrum debug build and capture six real UI screens
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 3072M
          emulator-boot-timeout: 600
          disable-animations: true
          script: bash tools/capture-emulator-showcase.sh
      - name: Upload screenshot and verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitrum-android13-real-emulator-showcase
          path: |
            assets/screenshots/*-android13-demo.png
            emulator-showcase/verification.txt
            emulator-showcase/*-crash.txt
            emulator-showcase/*-launch.txt
          if-no-files-found: warn
