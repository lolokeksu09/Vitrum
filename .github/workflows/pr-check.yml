name: PR checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Fetch verified Xray and test assets
        run: tools/FETCH_BINARIES.sh --linux
      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug assembleClone --no-daemon --console=plain
      - name: Verify isolated APK, label, shortcut and signing
        run: bash tools/verify-clone-apk.sh app/build/outputs/apk/clone/app-clone.apk
      - name: Clone APK for manual phone installation
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-Clone-test-APK
          path: app/build/outputs/apk/clone/app-clone.apk
          if-no-files-found: error
      - name: Unit-test XML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitrum-pr-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
