name: PR checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Android API 37 for Compose dependencies
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -n "$MANAGER" || { echo "::error::Android sdkmanager unavailable"; exit 1; }
          "$MANAGER" "platforms;android-37.0" "build-tools;37.0.0"
          test -f "$SDK/platforms/android-37.0/android.jar" || { echo "::error::Android 37.0 platform missing"; exit 1; }
      - name: Verify Kotlin plugin version alignment
        run: python3 tools/check-kotlin-plugins.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run focused route preview JVM tests
        run: ./gradlew :app:testCloneUnitTest --tests app.rayclient.RouteExplainTest --tests app.rayclient.RuleCheckTest --no-daemon --console=plain
      - name: Fetch verified Xray runtime assets
        run: tools/FETCH_BINARIES.sh --linux
      - name: Run full JVM unit test suite
        run: ./gradlew :app:testCloneUnitTest --no-daemon --console=plain
      - name: Upload JVM unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Vitrum-JVM-test-results
          path: app/build/test-results/testCloneUnitTest/*.xml
          if-no-files-found: warn
      - name: Check translation coverage
        run: python3 tools/i18n/dict_cov.py
      - name: Validate Android 16 UI matrix shell syntax
        run: bash -n tools/clone-android16-ui.sh
      - name: Compile Debug and Clone APKs
        run: ./gradlew assembleDebug assembleClone --no-daemon --console=plain
      - name: Compile release (unsigned) and Clone instrumentation tests
        run: ./gradlew :app:assembleRelease :app:assembleCloneAndroidTest --no-daemon --console=plain
      - name: Verify Clone APK identity and package metadata
        run: bash tools/verify-clone-apk.sh app/build/outputs/apk/clone/app-clone.apk
      - name: Upload Clone APK
        uses: actions/upload-artifact@v7
        with:
          name: Vitrum-Clone-test-APK
          path: app/build/outputs/apk/clone/app-clone.apk
          if-no-files-found: error
