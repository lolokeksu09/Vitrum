name: PR checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Kotlin plugin version alignment
        run: python3 tools/check-kotlin-plugins.py
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run focused route preview JVM tests
        run: ./gradlew :app:testCloneUnitTest --tests app.rayclient.RouteExplainTest --tests app.rayclient.RuleCheckTest --no-daemon --console=plain
      - name: Fetch verified Xray runtime assets
        run: tools/FETCH_BINARIES.sh --linux
      - name: Run full JVM unit test suite
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Upload JVM unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Vitrum-JVM-test-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: warn
      - name: Check translation coverage
        run: python3 tools/i18n/dict_cov.py
      - name: Validate Android 16 UI matrix shell syntax
        run: bash -n tools/clone-android16-ui.sh
      - name: Compile Debug and Clone APKs
        run: ./gradlew assembleDebug assembleClone --no-daemon --console=plain
      - name: Verify Clone APK identity and package metadata
        run: bash tools/verify-clone-apk.sh app/build/outputs/apk/clone/app-clone.apk
      - name: Upload Clone APK
        uses: actions/upload-artifact@v7
        with:
          name: Vitrum-Clone-test-APK
          path: app/build/outputs/apk/clone/app-clone.apk
          if-no-files-found: error
