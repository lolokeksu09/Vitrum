name: Vitrum Clone Android 16 UI smoke

on:
  pull_request:
    paths:
      - 'app/src/**'
      - 'app/build.gradle.kts'
      - '.github/workflows/clone-android16-ui.yml'
      - 'tools/clone-android16-ui.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android16-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Fetch verified Xray data assets required at application startup
        run: bash tools/FETCH_BINARIES.sh
      - name: Enable hardware acceleration for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 16 x86_64 UI-only Clone smoke
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            # Isolated temporary emulator ABI: never distribute this UI-only build.
            sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("x86_64")/' app/build.gradle.kts
            ./gradlew :app:assembleClone --no-daemon --console=plain
            bash tools/clone-android16-ui.sh
      - name: Upload screenshots and UI observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-Clone-Android16-UI
          path: clone-ui-report/
          if-no-files-found: warn
