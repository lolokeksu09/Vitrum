name: Vitrum Lite ARM32 experimental

on:
  pull_request:
    paths:
      - 'lite/**'
      - 'settings.gradle.kts'
      - 'tools/build-lite-arm32.sh'
      - 'tools/verify-lite-apk.sh'
      - '.github/workflows/lite.yml'
  push:
    branches: [main]
    paths:
      - 'lite/**'
      - 'settings.gradle.kts'
      - 'tools/build-lite-arm32.sh'
      - 'tools/verify-lite-apk.sh'
      - '.github/workflows/lite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android6-arm32:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      # ubuntu-latest already has the Android SDK and sdkmanager; the legacy setup action
      # attempts to install the removed SDK 'tools' package and fails on current runners.
      - name: Install pinned NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          [ -n "$MANAGER" ] || { echo "sdkmanager not found in $SDK"; exit 1; }
          "$MANAGER" "ndk;27.2.12479018"
      - name: Build Android 6 ARM32 Xray and JNI
        run: bash tools/build-lite-arm32.sh
      - name: Assemble independent tablet APK
        run: ./gradlew :lite:testDebugUnitTest :lite:assembleDebug --no-daemon --console=plain
      - name: Verify Android 6, architecture, package and signature
        run: bash tools/verify-lite-apk.sh lite/build/outputs/apk/debug/lite-debug.apk
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-Lite-ARM32-Android6
          path: lite/build/outputs/apk/debug/lite-debug.apk
          if-no-files-found: error
      - name: Publish versioned Lite 1.0 prerelease from verified main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' lite/build.gradle.kts | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid Lite version: $VERSION"; exit 1; }
          TAG="lite-v$VERSION"
          APK="Vitrum-Lite-$VERSION-Android6-ARM32.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Do not overwrite an immutable release."
            exit 1
          fi
          cp lite/build/outputs/apk/debug/lite-debug.apk "$APK"
          {
            echo "# Vitrum Lite $VERSION — Android 6 ARM32"
            echo
            echo "**Экспериментальный pre-release**: реальная работа VPN и отключение на физическом SM-T805 не подтверждены. Версия 1.0.0 — номер отдельного продукта Lite, не стабильность трафика."
            echo '- Package ID: `app.rayclient.lite` (не заменяет основное Vitrum).'
            echo '- Android 6.0+ (API 23), armeabi-v7a, Xray 26.3.27.'
            echo '- VLESS, VMess, Trojan, Shadowsocks, Hysteria2; HTTPS-подписка, запоминание профиля через Android Keystore, раздельное туннелирование.'
            echo '- Явная остановка VPN, предотвращение незаметной смены сервера, TCP-задержка (не проверка VPN-туннеля).'
            echo '- CI: Gradle/JUnit, Go+JNI ARM32, ELF32/ABI/minSdk, подпись APK; отдельный UI-сценарий Android 6 x86 не проверяет рабочий Xray.'
            echo '- Внимание: Android 6 устарел. Проверьте DNS, IPv4/IPv6 и прямой обход при split tunneling.'
            echo '- APK подписан одноразовым debug-ключом GitHub Actions. Для обновления старой версии может потребоваться удалить её, предварительно сохранив подписку.'
            echo
            echo "SHA-256:"
            echo '```'
            sha256sum "$APK"
            echo '```'
          } > notes.md
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --title "Vitrum Lite v$VERSION (Android 6 ARM32)" --notes-file notes.md
