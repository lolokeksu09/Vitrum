name: Vitrum Lite ARM32 experimental

on:
  pull_request:
    paths:
      - 'lite/**'
      - 'settings.gradle.kts'
      - 'tools/build-lite-arm32.sh'
      - 'tools/verify-lite-apk.sh'
      - '.github/workflows/lite.yml'
  push:
    branches: [main]
    paths:
      - 'lite/**'
      - 'settings.gradle.kts'
      - 'tools/build-lite-arm32.sh'
      - 'tools/verify-lite-apk.sh'
      - '.github/workflows/lite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android6-arm32:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
      # ubuntu-latest already has the Android SDK and sdkmanager; the legacy setup action
      # attempts to install the removed SDK 'tools' package and fails on current runners.
      - name: Install pinned NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -n 1)"
          [ -n "$MANAGER" ] || { echo "sdkmanager not found in $SDK"; exit 1; }
          "$MANAGER" "ndk;27.2.12479018"
      - name: Build Android 6 ARM32 Xray and JNI
        run: bash tools/build-lite-arm32.sh
      - name: Assemble independent tablet APK
        run: ./gradlew :lite:testDebugUnitTest :lite:assembleDebug --no-daemon --console=plain
      - name: Verify Android 6, architecture, package and signature
        run: bash tools/verify-lite-apk.sh lite/build/outputs/apk/debug/lite-debug.apk
      - name: Upload experimental APK
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-Lite-ARM32-Android6
          path: lite/build/outputs/apk/debug/lite-debug.apk
          if-no-files-found: error
      - name: Publish separate experimental prerelease only from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:12}"
          TAG="lite-$SHORT"
          APK="Vitrum-Lite-ARM32-$SHORT.apk"
          cp lite/build/outputs/apk/debug/lite-debug.apk "$APK"
          {
            echo "# Vitrum Lite 32 — экспериментальный ARMv7 APK"
            echo
            echo "**Не прошёл тест на физическом SM-T805.** Только проверка сборки, APK, ABI и подписи."
            echo "- Package ID: `app.rayclient.lite` (отдельно от обычного Vitrum и Vitrum Clone)."
            echo "- Android 6.0+ (API 23); armeabi-v7a; Xray 26.3.27 самостоятельно собран из исходников."
            echo "- Без Compose, геобаз, игр и тяжёлых UI-функций."
            echo "- Только VLESS и Trojan (TCP/WS, TLS/Reality). Без подписок."
            echo "- Android 6 имеет устаревшие исправления безопасности. Используйте только для тестов."
            echo "- Android разрешает только один активный VPN."
            echo "- Debug-подпись одноразовая: обновление поверх другой сборки может быть невозможно."
            echo "- SHA-256:"
            sha256sum "$APK"
          } > notes.md
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --prerelease --title "Vitrum Lite ARM32 experimental ($SHORT)" --notes-file notes.md
