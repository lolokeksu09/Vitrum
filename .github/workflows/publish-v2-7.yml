name: Publish Vitrum v2.7.0 pre-release candidate

# Release the reviewed PR source without merging it into main. Every run first
# executes the same tests/APK checks as a PR; build.yml re-tests the immutable tag.
on:
  push:
    branches: [release/vitrum-2.7.0-encrypted-dns]
    paths: ['.github/workflows/publish-v2-7.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-vitrum-v2-7-0
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/pr-check.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify candidate version and original author certificate
        env:
          KS_B64: ${{ secrets.VITRUM_KS_BASE64 }}
          KS_PASS_SECRET: ${{ secrets.VITRUM_KS_PASS }}
        run: |
          set -euo pipefail
          test "$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)" = '2.7.0'
          test "$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)" = '270'
          test -s docs/releases/v2.7.0.md
          test -s app/src/main/java/app/rayclient/EncryptedDnsRouteAudit.kt
          test -s app/src/test/java/app/rayclient/EncryptedDnsGuardTest.kt
          test -s app/src/main/java/app/rayclient/AndroidPrivateDnsPolicy.kt
          test -s app/src/test/java/app/rayclient/AndroidPrivateDnsPolicyTest.kt
          test -s docs/VITRUM_2_7_ENCRYPTED_DNS.md
          test -s docs/releases/v2.7.0.md
          test -n "$KS_B64" && test -n "$KS_PASS_SECRET" || { echo '::error::Author signing secrets absent'; exit 1; }
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          umask 077
          printf '%s' "$KS_B64" | base64 -d > "$KEY_FILE"
          CERT="$(keytool -exportcert -keystore "$KEY_FILE" -alias vitrum -storepass:env KS_PASS_SECRET |
            openssl x509 -inform DER -noout -fingerprint -sha256 |
            sed 's/.*=//' | tr -d ':' | tr 'A-F' 'a-f')"
          test "$CERT" = '8cb8b675f97239948f0b93ac4208464e856397d6141268798129c00337205c61' || {
            echo '::error::Unexpected author certificate'; exit 1;
          }
      - name: Tag tested candidate and dispatch official signed build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG='v2.7.0'
          SHA="$(git rev-parse HEAD)"
          if CURRENT="$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            test "$CURRENT" = "$SHA" || { echo '::error::Tag belongs to a different source; refusing replacement'; exit 1; }
          else
            gh api -X POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing replacement'
            exit 0
          fi
          gh workflow run build.yml --ref main -f tag="$TAG" -f stable=false
