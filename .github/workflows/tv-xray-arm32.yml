name: Vitrum TV ARM32 Xray toolchain proof

on:
  pull_request:
    paths:
      - '.github/workflows/tv-xray-arm32.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray-android-arm32:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache: false
      - name: Check pinned upstream identity
        run: |
          git clone --filter=blob:none --quiet https://github.com/XTLS/Xray-core.git /tmp/xray-core
          cd /tmp/xray-core
          git checkout --detach 676eaf66f8f05d4d558ee7a74b4736623d3feeb9
          test "$(git rev-parse HEAD)" = "676eaf66f8f05d4d558ee7a74b4736623d3feeb9"
          grep -Fxq 'go 1.27' go.mod
          go version
      - name: Cross-compile standalone Android armv7 Xray
        working-directory: /tmp/xray-core
        env:
          GOOS: android
          GOARCH: arm
          GOARM: '7'
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -buildvcs=false -ldflags='-s -w -buildid=' -o "$GITHUB_WORKSPACE/xray-android-armv7" ./main
          file "$GITHUB_WORKSPACE/xray-android-armv7"
          readelf -h "$GITHUB_WORKSPACE/xray-android-armv7" | tee "$GITHUB_WORKSPACE/xray-elf.txt"
          readelf -h "$GITHUB_WORKSPACE/xray-android-armv7" | grep -F 'Machine:'
          readelf -h "$GITHUB_WORKSPACE/xray-android-armv7" | grep -q 'ARM'
          sha256sum "$GITHUB_WORKSPACE/xray-android-armv7" | tee "$GITHUB_WORKSPACE/xray-sha256.txt"
      - name: Upload Android ARM32 test binary and ELF report
        uses: actions/upload-artifact@v4
        with:
          name: Vitrum-TV-Xray-android-armv7-experimental
          path: |
            xray-android-armv7
            xray-elf.txt
            xray-sha256.txt
          if-no-files-found: error
